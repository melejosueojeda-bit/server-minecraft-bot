name: Minecraft NPC Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Esta configuración Cancela automáticamente cualquier bot anterior para que SOLO HAYA 1 corriendo a la vez
concurrency:
  group: minecraft-bot-single-instance
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar dependencias de Bedrock Protocol
      run: npm install bedrock-protocol

    - name: Ejecutar script del NPC
      run: node bot.js
